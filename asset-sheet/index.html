<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Planet — Asset Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Same tokens as the main app (index.html), so this reads like part of the same product. */
  :root {
    --card: #fffdf8;
    --ink: #2c5f6f;
    --ink-soft: #7fa3ae;
    --accent: #ff9f68;
    --accent-deep: #f4804a;
    --shadow-soft: 0 4px 14px rgba(44, 95, 111, .12);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  html, body {
    margin: 0; min-height: 100%; background: #dff1f7;
    font-family: Quicksand, system-ui, sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 14px 20px; background: rgba(223, 241, 247, .94);
    backdrop-filter: blur(6px); box-shadow: var(--shadow-soft);
  }
  a#back {
    padding: 8px 16px; border-radius: 999px; text-decoration: none;
    background: var(--card); box-shadow: var(--shadow-soft);
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
  }
  a#back:hover { color: var(--ink); }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; }
  input {
    flex: 1 1 380px; min-width: 240px;
    padding: 9px 14px; border: none; border-radius: 999px;
    background: var(--card); box-shadow: var(--shadow-soft);
    font: inherit; font-size: 13px; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    padding: 9px 20px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 13px;
    box-shadow: var(--shadow-soft); transition: transform .25s var(--spring);
  }
  button:hover { background: var(--accent-deep); transform: translateY(-1px); }
  #status { width: 100%; font-size: 12px; color: var(--ink-soft); }

  #shortcuts { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  #shortcuts button {
    background: var(--card); color: var(--ink-soft);
    font-size: 11px; font-weight: 600; padding: 5px 12px;
  }
  #shortcuts button:hover { background: #fff; color: var(--ink); }

  #grid {
    display: grid; gap: 14px; padding: 20px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .cell {
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow-soft); text-align: center;
  }
  .cell canvas { display: block; width: 100%; height: 170px; background: #eef7f2; }
  .cell .name {
    padding: 8px 10px 2px; font-size: 12px; font-weight: 700;
    word-break: break-word; line-height: 1.3;
  }
  .cell .meta { padding: 0 10px 10px; font-size: 11px; color: var(--ink-soft); }
  .cell.failed .name { color: #c2603f; }
</style>
</head>
<body>

<header>
  <a id="back" href="../">← planet</a>
  <h1>Asset sheet</h1>
  <input id="dir" type="text" spellcheck="false"
         value="assets/standalone/buildings/pirate-kit"
         placeholder="a folder of .glb files, e.g. assets/standalone/ships/pirate-kit" />
  <button id="go" type="button">Render</button>
  <div id="shortcuts"></div>
  <p id="status">Every model in a folder, drawn at a common size. Look before you catalogue:
    <code>assets/standalone/</code> is sorted by folder name, not by inspection, and holds
    component parts as well as whole objects.</p>
</header>

<div id="grid"></div>

<script src="../three-r128.min.js"></script>
<script src="../vendor/GLTFLoader.js"></script>
<script src="asset-sheet.js"></script>
</body>
</html>
