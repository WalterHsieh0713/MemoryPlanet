<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hex-sphere Inspector</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151c; font-family: system-ui, sans-serif; }
  #scene-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #scene-canvas.dragging { cursor: grabbing; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 10px 14px; border-radius: 8px; background: rgba(20,26,34,.85); color: #dfe8ef; font-size: 13px; line-height: 1.5; min-width: 220px; }
  #hud b { color: #9fd3ff; }
  #hint { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(20,26,34,.7); color: #9aa8b4; font-size: 12px; }
</style>
</head>
<body>
<canvas id="scene-canvas"></canvas>
<div id="hud">Loading grid…</div>
<div id="hint">Drag to orbit · scroll to zoom · click a tile</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="hexsphere-inspector.js"></script>
</body>
</html>
